<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Penta TV</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #pentaTV {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

  <video
    id="pentaTV"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

  <script>
    const video = document.getElementById("pentaTV");

    let versionActual = null;

    video.muted = true;
    video.defaultMuted = true;

    async function revisarVersion() {
      try {
        const respuesta = await fetch(
          "version.txt?t=" + Date.now(),
          { cache: "no-store" }
        );

        const nuevaVersion = (await respuesta.text()).trim();

        if (versionActual === null) {
          versionActual = nuevaVersion;
          cargarVideo(nuevaVersion);
          return;
        }

        if (nuevaVersion !== versionActual) {
          versionActual = nuevaVersion;
          cargarVideo(nuevaVersion);
        }

      } catch (error) {
        console.log("No se pudo comprobar la versión.");
      }
    }

    function cargarVideo(version) {
      const tiempoAnterior = video.currentTime || 0;

      video.src = "video.mp4?v=" + encodeURIComponent(version);
      video.load();

      video.addEventListener("loadedmetadata", function restaurarTiempo() {
        if (tiempoAnterior < video.duration) {
          video.currentTime = tiempoAnterior;
        }

        video.play().catch(() => {
          console.log("El navegador bloqueó el autoplay.");
        });

        video.removeEventListener("loadedmetadata", restaurarTiempo);
      });
    }

    revisarVersion();

    // Revisar cada 30 segundos
    setInterval(revisarVersion, 30000);

  </script>

</body>
</html>
