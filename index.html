<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Penta TV</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #pentaTV {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

  <video
    id="pentaTV"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source src="video.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("pentaTV");

    video.muted = true;
    video.defaultMuted = true;

    function iniciarPentaTV() {
      video.play().catch(() => {
        console.log("Safari bloqueó temporalmente el autoplay.");
      });
    }

    window.addEventListener("load", iniciarPentaTV);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) iniciarPentaTV();
    });

    document.addEventListener("touchstart", iniciarPentaTV, { once: true });
    document.addEventListener("click", iniciarPentaTV, { once: true });
  </script>

</body>
</html>
